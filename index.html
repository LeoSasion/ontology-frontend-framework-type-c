<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AIBI-C</title>
    <script>
      (function () {
        var fallbackDarkTheme = {
          themeKey: "D1",
          mode: "dark",
          tokens: {
            railTop: "#10212a",
            railMid: "#0f2d37",
            railBottom: "#092029",
            railActive: "#173744",
            primary: "#67e8f9",
            primaryHover: "#22d3ee",
            selected: "#164e63",
            soft: "#0e3744",
            bg: "#0b1419",
            surface: "#111c22",
            panel: "#15262d",
            border: "#28424d",
            text: "#e5f3f7",
            muted: "#9db4bd"
          },
          railActiveText: "#ffffff"
        };
        function readStoredTheme() {
          try {
            var raw = window.localStorage.getItem("aibiHybrid.themeSnapshot");
            return raw ? JSON.parse(raw) : null;
          } catch (error) {
            return null;
          }
        }
        function applyTheme(theme) {
          if (!theme || !theme.tokens) return;
          var root = document.documentElement;
          var mode = theme.mode === "dark" ? "dark" : "light";
          root.dataset.themeKey = theme.themeKey || "";
          root.dataset.themeMode = mode;
          root.style.colorScheme = mode;
          var tokenMap = {
            bg: ["--bg", "--bi-bg"],
            surface: ["--surface", "--bi-surface"],
            panel: ["--surface-2", "--bi-panel"],
            border: ["--line", "--bi-border", "--bi-border-soft"],
            text: ["--text", "--bi-text"],
            muted: ["--muted", "--soft", "--bi-muted"],
            primary: ["--accent", "--bi-accent"],
            primaryHover: ["--accent-strong", "--bi-accent-strong"],
            selected: ["--accent-soft", "--bi-accent-tint"],
            soft: ["--bi-accent-soft"],
            railTop: ["--bi-rail-top"],
            railMid: ["--bi-rail-mid"],
            railBottom: ["--bi-rail-bottom"],
            railActive: ["--bi-rail-active"]
          };
          Object.keys(theme.tokens).forEach(function (token) {
            var variables = tokenMap[token] || ["--bi-theme-" + token];
            variables.forEach(function (variable) {
              root.style.setProperty(variable, theme.tokens[token]);
            });
          });
          if (theme.railActiveText) {
            root.style.setProperty("--bi-rail-active-text", theme.railActiveText);
          }
          var onAccent = theme.onAccent || (mode === "dark" ? "#062b33" : "#ffffff");
          root.style.setProperty("--on-accent", onAccent);
          root.style.setProperty("--bi-on-accent", onAccent);
          if (theme.strongBorder) {
            root.style.setProperty("--line-strong", theme.strongBorder);
            root.style.setProperty("--bi-border-strong", theme.strongBorder);
          }
          try {
            window.localStorage.setItem("aibiHybrid.themeSnapshot", JSON.stringify({
              themeKey: theme.themeKey,
              mode: mode,
              tokens: theme.tokens,
              onAccent: onAccent,
              strongBorder: theme.strongBorder,
              railActiveText: theme.railActiveText
            }));
          } catch (error) {
            // Theme is still applied even if storage is blocked.
          }
        }
        try {
          var theme = readStoredTheme();
          if (!theme && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = fallbackDarkTheme;
          }
          applyTheme(theme);
        } catch (error) {
          document.documentElement.dataset.themeMode = document.documentElement.dataset.themeMode || "light";
        }
      })();
    </script>
    <script>
      (function () {
        var shortSideFloor = 720;
        var pendingFrame = 0;
        function applyViewportFloor() {
          var root = document.documentElement;
          var width = Math.max(1, window.innerWidth);
          var height = Math.max(1, window.innerHeight);
          var reportedDevicePixelRatio = Number(window.devicePixelRatio);
          var devicePixelRatio = Number.isFinite(reportedDevicePixelRatio) && reportedDevicePixelRatio > 0
            ? reportedDevicePixelRatio
            : 1;
          var resolutionWidth = width * devicePixelRatio;
          var resolutionHeight = height * devicePixelRatio;
          var portrait = height >= width;
          var baselineWidth = portrait ? 720 : 1280;
          var baselineHeight = portrait ? 1280 : 720;
          var scaled = Math.min(resolutionWidth, resolutionHeight) < shortSideFloor;
          var scale = scaled ? Math.min(width / baselineWidth, height / baselineHeight) : 1;
          var logicalWidth = scaled ? baselineWidth : width;
          var logicalHeight = scaled ? baselineHeight : height;
          var left = scaled ? (width - logicalWidth * scale) / 2 : 0;
          var top = scaled ? (height - logicalHeight * scale) / 2 : 0;
          root.dataset.viewportMode = scaled ? "scaled" : "responsive";
          root.dataset.viewportOrientation = portrait ? "portrait" : "landscape";
          root.dataset.viewportScale = scale.toFixed(6);
          root.dataset.logicalWidth = logicalWidth.toFixed(2);
          root.dataset.logicalHeight = logicalHeight.toFixed(2);
          root.dataset.baselineWidth = String(baselineWidth);
          root.dataset.baselineHeight = String(baselineHeight);
          root.dataset.viewportDevicePixelRatio = devicePixelRatio.toFixed(3);
          root.dataset.viewportResolutionWidth = resolutionWidth.toFixed(2);
          root.dataset.viewportResolutionHeight = resolutionHeight.toFixed(2);
          root.style.setProperty("--viewport-scale", String(scale));
          root.style.setProperty("--viewport-logical-width", logicalWidth + "px");
          root.style.setProperty("--viewport-logical-height", logicalHeight + "px");
          root.style.setProperty("--viewport-left", left + "px");
          root.style.setProperty("--viewport-top", top + "px");
        }
        function scheduleViewportFloor() {
          window.cancelAnimationFrame(pendingFrame);
          pendingFrame = window.requestAnimationFrame(applyViewportFloor);
        }
        applyViewportFloor();
        window.addEventListener("resize", scheduleViewportFloor);
        if (window.visualViewport) window.visualViewport.addEventListener("resize", scheduleViewportFloor);
      })();
    </script>
    <style>
      html[data-theme-mode="dark"],
      html[data-theme-mode="dark"] body {
        background: var(--bg, #0b1419);
        color: var(--text, #e5f3f7);
      }
    </style>
  </head>
  <body>
    <div class="viewportScaleFrame" data-testid="viewport-scale-frame">
      <div class="viewportScaleSurface" data-testid="viewport-scale-surface">
        <div id="root"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
