name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify
        run: npm run verify:ci

      - name: Start local services
        run: npm run local:start

      - name: Verify local health
        run: npm run local:health

      - name: Verify server security runtime
        run: npm run verify:security-runtime

      - name: Verify browser smoke paths
        run: |
          npm run verify:ui-flow
          npm run verify:ui-visual
          npm run verify:ui-empty

      - name: Stop local services
        if: always()
        run: npm run local:stop
